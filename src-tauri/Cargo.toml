[package]
name = "cosmovideo"
version = "1.1.2"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "CosmoSymphony"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html



[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1", features = ["full"] }
tauri = { version = "2.5", features = ["protocol-asset", "devtools"] }
tauri-macros = "2.5"
tauri-plugin-log = "2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
base64 = "0.22.1"
tauri-plugin-opener = "2.5.3"
tauri-plugin-drag = "2"
chrono = "0.4"
urlencoding = "2.1"
sysinfo = "0.33"
dirs = "6.0"
trash = "5.2"
notify = "6.1.1"
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tower = { version = "0.5", features = ["util"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.4.1"

[patch.crates-io]
tauri-macros = { path = "C:/Users/louis/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/tauri-macros-2.5.4" }
